services:
  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-network

  frontend:
    image: ghcr.io/khushivermaa85-collab/nginx-production-lab-frontend:latest
    container_name: frontend-prod
    restart: unless-stopped
    networks:
      - devops-network

  backend:
    image: ghcr.io/khushivermaa85-collab/nginx-production-lab-backend:latest
    container_name: backend-prod
    restart: unless-stopped
    environment:
      SERVICE_NAME: backend-1
    networks:
      - devops-network

  backend-2:
    image: ghcr.io/khushivermaa85-collab/nginx-production-lab-backend-2:latest
    container_name: backend-prod-2
    restart: unless-stopped
    environment:
      SERVICE_NAME: backend-2
    networks:
      - devops-network

networks:
  devops-network:
    external: true
