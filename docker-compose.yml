services:
  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - devops-network

  frontend:
    build: ./frontend
    container_name: frontend-prod
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - devops-network

  backend:
    build: ./backend/backend
    container_name: backend-prod
    restart: unless-stopped
    environment:
      SERVICE_NAME: backend-1
    networks:
      - devops-network

  backend-2:
    build: ./backend/backend
    container_name: backend-prod-2
    restart: unless-stopped
    environment:
      SERVICE_NAME: backend-2
    networks:
      - devops-network

networks:
  devops-network:
    external: true
