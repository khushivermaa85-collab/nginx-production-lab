name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Tag frontend image
        run: docker tag nginx-production-lab-frontend ghcr.io/${{ github.repository_owner }}/nginx-production-lab-frontend:latest

      - name: Tag backend image
        run: docker tag nginx-production-lab-backend ghcr.io/${{ github.repository_owner }}/nginx-production-lab-backend:latest

      - name: Tag backend-2 image
        run: docker tag nginx-production-lab-backend-2 ghcr.io/${{ github.repository_owner }}/nginx-production-lab-backend-2:latest

      - name: Start services
        run: |
          docker network create devops-network
          docker compose up -d

      - name: Test API
        run: |
          for i in {1..15}; do
            curl --fail 127.0.0.1:8080/api/ && exit 0
            sleep 2
          done
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down
      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/nginx-production-lab-frontend:latest

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/nginx-production-lab-backend:latest

      - name: Push backend-2 image
        run: docker push ghcr.io/${{ github.repository_owner }}/nginx-production-lab-backend-2:latest

      - name: Deploy production stack
        run: |
          docker network create devops-network || true
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
