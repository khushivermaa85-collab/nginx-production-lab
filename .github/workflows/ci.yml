name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Tag frontend image
        run: docker tag nginx-production-lab-frontend ghcr.io/${{ github.repository_owner }}/nginx-production-lab-frontend:latest

      - name: Start services
        run: |
          docker network create devops-network
          docker compose up -d

      - name: Test API
        run: curl --fail 127.0.0.1:8080/api/

      - name: Cleanup
        if: always()
        run: docker compose down
